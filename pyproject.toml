[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "norm-freshness"
version = "0.3.0"
description = "Is the rule you enforce still the rule that was written? A per-rule staleness verdict a gate can consume — graded by change kind, fail-closed, terminal-for-machine."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "flxk1" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
norm_freshness = ["py.typed"]
