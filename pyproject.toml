[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "norm-freshness"
description = "Is the rule you enforce still the rule that was written? A per-rule staleness verdict a gate can consume — graded by change kind, fail-closed, terminal-for-machine."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSES/*", "NOTICE"]
authors = [{ name = "flxk1" }]
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.dynamic]
version = { attr = "norm_freshness._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
norm_freshness = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
